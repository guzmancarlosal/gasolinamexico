apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'


import groovy.json.JsonSlurper

def versionFile = rootProject.file("version.json")
def appVersion = [versionName: "2.8.5", versionCode: 33]
if (versionFile.exists()) {
    def parsed = new JsonSlurper().parseText(versionFile.text)
    appVersion.versionName = parsed.versionName
    appVersion.versionCode = parsed.versionCode as Integer
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    signingConfigs {
        release {
            def storePath = keystoreProperties['storeFile'] ?: "gasolinaMexico.jks"
            def storeF = null
            if (rootProject.file(storePath).exists()) {
                storeF = rootProject.file(storePath)
            } else if (file(storePath).exists()) {
                storeF = file(storePath)
            } else if (rootProject.file("gasolinaMexico.jks").exists()) {
                storeF = rootProject.file("gasolinaMexico.jks")
            } else if (file("../gasolinaMexico.jks").exists()) {
                storeF = file("../gasolinaMexico.jks")
            }

            if (storeF != null && storeF.exists()) {
                storeFile storeF
                storePassword keystoreProperties['storePassword'] ?: "Carlos10"
                keyAlias keystoreProperties['keyAlias'] ?: "gasolinamexico"
                keyPassword keystoreProperties['keyPassword'] ?: "Carlos10"
            }
        }
    }

    defaultConfig {
        applicationId "com.ttpCorp.carlosguzman.gasolinamexico"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode appVersion.versionCode
        versionName appVersion.versionName
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"file:///android_asset/dist/index.html\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\"" // ID de prueba oficial de Google
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"file:///android_asset/dist/index.html\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3403038737253823/5587497426\"" // Reemplazar con tu ID de bloque de anuncios de AdMob
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace 'com.ttpCorp.carlosguzman.preciogasolinamexico'
}
repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}
dependencies {


    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v2.1.6'
    implementation platform('com.google.firebase:firebase-bom:33.7.0') // Existing BoM
    implementation 'com.google.firebase:firebase-analytics-ktx' // Includes firebase-core
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.firebase:firebase-config'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
}
